# Everything that builds the stateless guest: the bare-metal cross-compile, the
# host binary and the zkVM ELFs.
#
# Separate from ci.yml because each zkVM brings its own toolchain and vendor
# archive.

name: Stateless guest CI

on:
  push:
    branches:
      - master
    # Guest releases; GitHub skips the path filters for tag pushes.
    tags:
      - 'stateless-guest-v*'
    paths-ignore:
      - 'doc/**'
      - 'portal/**'
      - '**/*.md'
      - 'hive_integration/**'
      - 'nimbus_verified_proxy/**'
      - 'docker/**'
      - 'metrics/**'

  pull_request:
    paths-ignore:
      - 'doc/**'
      - 'portal/**'
      - '**/*.md'
      - 'hive_integration/**'
      - 'nimbus_verified_proxy/**'
      - 'docker/**'
      - 'metrics/**'

  workflow_dispatch:

concurrency: # Cancel stale PR builds (but not push builds)
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  stateless_guest:
    name: Stateless guest (bare-metal + ZisK)

    strategy:
      matrix:
        os: [linux]
        cpu: [amd64]

    runs-on: ubuntu-22.04

    # Pinned, so a toolchain or vendor bump is a visible commit rather than a
    # silent change in what CI proved.
    env:
      XPACK_GCC_VERSION: 15.2.0-1
      ZISK_REF: v1.1.0-alpha

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout nimbus-eth1
        uses: actions/checkout@v6

      - id: shared-action
        uses: ./.github/actions/shared
        with:
          nim-cache: true

      # ~400 MB extracted, so cache on the version rather than refetch per run.
      - name: Cache xPack riscv-none-elf-gcc
        id: xpack-cache
        uses: actions/cache@v5
        with:
          path: ~/.local/xPacks/riscv-none-elf-gcc
          key: xpack-riscv-none-elf-gcc-${{ env.XPACK_GCC_VERSION }}

      - name: Install xPack riscv-none-elf-gcc
        if: steps.xpack-cache.outputs.cache-hit != 'true'
        run: |
          V="${XPACK_GCC_VERSION}"
          B="https://github.com/xpack-dev-tools/riscv-none-elf-gcc-xpack/releases/download/v$V"
          A="xpack-riscv-none-elf-gcc-$V-linux-x64.tar.gz"
          curl -sSLO "$B/$A"
          curl -sSLO "$B/$A.sha"
          sha256sum -c "$A.sha"   # verify before extracting
          D="$HOME/.local/xPacks/riscv-none-elf-gcc"
          mkdir -p "$D"
          tar -xzf "$A" -C "$D" --strip-components=1

      # ZisK does not ship this as a binary, it has to come from a checkout.
      # riscv64im-unknown-none-elf is a Tier 3 target: no prebuilt core/alloc
      # ships for it, so nightly plus rust-src are needed for -Z build-std to
      # compile them.
      - name: Cache ZisK static library
        id: zisk-cache
        uses: actions/cache@v5
        with:
          path: ~/.local/zisk/libziskos_staticlib.a
          key: ziskos-staticlib-${{ env.ZISK_REF }}

      - name: Build ZisK static library
        if: steps.zisk-cache.outputs.cache-hit != 'true'
        run: |
          rustup toolchain install nightly --component rust-src
          git clone --depth 1 --branch "${ZISK_REF}" \
            https://github.com/0xPolygonHermez/zisk.git /tmp/zisk
          cd /tmp/zisk
          cargo +nightly build -p ziskos-staticlib --release \
            --target riscv64im-unknown-none-elf -Z build-std=core,alloc \
            --config 'profile.release.lto="fat"' --features panic-handler
          mkdir -p "$HOME/.local/zisk"
          cp target/riscv64im-unknown-none-elf/release/libziskos_staticlib.a \
             "$HOME/.local/zisk/"

      - name: Build the guest
        run: |
          ./env.sh nim --version
          DEFAULT_MAKE_FLAGS="-j$(nproc)"
          GCC="$HOME/.local/xPacks/riscv-none-elf-gcc/bin/riscv-none-elf-gcc"
          $GCC --version | head -1

          # Nim -> C for a bare-metal riscv target. Stops before the C compiler,
          # so this is only a check that the guest still builds under
          # os:any/standalone.
          make ${DEFAULT_MAKE_FLAGS} stateless_guest_baremetal

          # Host binary, reading and writing over stdin/stdout.
          make ${DEFAULT_MAKE_FLAGS} stateless_guest_native

          # The real artifact: cross-compiled and linked against the vendor
          # archive. Catches anything the two above cannot, since only this one
          # links.
          make ${DEFAULT_MAKE_FLAGS} \
            ZKVM=zisk \
            ZKVM_GCC="$GCC" \
            ZISK_LIB="$HOME/.local/zisk/libziskos_staticlib.a" \
            stateless_guest_zkvm

      # Named the way the eth-act benchmark harness resolves guests
      - name: Stage the guest ELF
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p artifacts
          cp build/stateless_guest_zisk.elf \
             "artifacts/stateless-validator-nimbus-zisk-${ZISK_REF}.elf"
          {
            echo '```'
            sha256sum artifacts/*.elf
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the guest ELF
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: stateless-validator-nimbus-zisk-${{ env.ZISK_REF }}
          path: artifacts/
          retention-days: 5
          if-no-files-found: error

  release:
    name: Draft the guest pre-release
    needs: stateless_guest
    if: startsWith(github.ref, 'refs/tags/stateless-guest-v')

    runs-on: ubuntu-22.04

    permissions:
      contents: write

    env:
      ZISK_REF: v1.1.0-alpha

    defaults:
      run:
        shell: bash

    steps:
      # The proving key unpacks to 14 GB and the setup writes ~4 GB beside it.
      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost "$AGENT_TOOLSDIRECTORY"
          df -h / | tail -1

      - name: Download the guest ELF
        uses: actions/download-artifact@v8
        with:
          name: stateless-validator-nimbus-zisk-${{ env.ZISK_REF }}
          path: artifacts

      # Merkle root of the compiled ROM trace, it needs the prover program-setup.
      - name: Generate the verification key
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
            build-essential xz-utils jq libomp-dev libgmp-dev \
            nlohmann-json3-dev protobuf-compiler uuid-dev libsecp256k1-dev \
            libsodium-dev nasm libopenmpi-dev openmpi-bin openmpi-common \
            libclang-dev clang gcc-riscv64-unknown-elf

          export ZISK_VERSION="${ZISK_REF#v}" SETUP_KEY=proving-no-consttree USE_GPU=false
          curl -sSf "https://raw.githubusercontent.com/0xPolygonHermez/zisk/${ZISK_REF}/ziskup/ziskup" | bash
          export PATH="$HOME/.zisk/bin:$PATH"

          # Written next to ~4 GB of assembly output, which is discarded.
          OUT="$(mktemp -d)"
          cargo-zisk-dev program-setup \
            --elf "artifacts/stateless-validator-nimbus-zisk-${ZISK_REF}.elf" \
            --output-dir "$OUT"

          VK="artifacts/stateless-validator-nimbus-zisk-${ZISK_REF}.vk"
          cp "$OUT"/*.verkey.bin "$VK"
          rm -rf "$OUT"

          # A truncated key would otherwise publish silently.
          [ "$(stat -c%s "$VK")" -eq 32 ] || {
            echo "expected a 32 byte VK, got $(stat -c%s "$VK")" >&2; exit 1; }
          printf 'VK: 0x%s\n' "$(od -An -v -tx1 "$VK" | tr -d ' \n')"

      - name: Write the release notes
        run: |
          # sha256 is what ere-guests pins, adding also sha512 for consistency
          {
            echo "Stateless validator guest for ZisK ${ZISK_REF}, built from ${GITHUB_SHA}."
            echo
            echo '### SHA256 checksums'
            echo
            echo '```'
            (cd artifacts && sha256sum ./*)
            echo '```'
            echo
            echo '### SHA512 checksums'
            echo
            echo '```'
            (cd artifacts && sha512sum ./*)
            echo '```'
          } > notes.md
          cat notes.md >> "$GITHUB_STEP_SUMMARY"

      - name: Create the pre-release draft
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          draft: true
          prerelease: true
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body_path: notes.md
          files: artifacts/*
