# Runs either as a tagged release (push of a "v*" tag) or as a nightly
# (nightly_build.yml calls it with "nightly: true"), so the nightly exercises
# the same pipeline a real release uses. The "setup" job resolves everything
# that differs between the two modes.

on:
  push:
    tags:
    - 'v*' # "v1.2.3"
  workflow_call:
    inputs:
      nightly:
        description: 'Run as a nightly build instead of a tagged release'
        required: false
        default: false
        type: boolean

name: Upload Release Asset

jobs:
  setup:
    name: Resolve build identity
    runs-on: ubuntu-latest

    outputs:
      is_nightly:    ${{ steps.identity.outputs.is_nightly }}
      version:       ${{ steps.identity.outputs.version }}
      docker_tag:    ${{ steps.identity.outputs.docker_tag }}
      release_tag:   ${{ steps.identity.outputs.release_tag }}
      release_name:  ${{ steps.identity.outputs.release_name }}
      npm_version:   ${{ steps.identity.outputs.npm_version }}
      wasm_dir:      ${{ steps.identity.outputs.wasm_dir }}

    steps:
      - name: Resolve identity
        id: identity
        env:
          NIGHTLY: ${{ inputs.nightly }}
        run: |
          SHA8="${GITHUB_SHA:0:8}"

          if [[ "${NIGHTLY}" == "true" ]]; then
            BRANCH="${GITHUB_REF#refs/heads/}"
            {
              echo "is_nightly=true"
              echo "version=nightly-latest"
              echo "docker_tag=nightly"
              echo "release_tag=nightly"
              echo "release_name=Nightly build (\"${BRANCH}\" branch, ${SHA8})"
              echo "npm_version=0.0.0-nightly"
              echo "wasm_dir=nightly"
            } >> "$GITHUB_OUTPUT"
          else
            if [[ "${GITHUB_REF}" != refs/tags/* ]]; then
              echo "Release mode requires a tag ref, got '${GITHUB_REF}'." >&2
              echo "Call this workflow with 'nightly: true' to build from a branch." >&2
              exit 1
            fi
            TAG="${GITHUB_REF#refs/tags/}"
            {
              echo "is_nightly=false"
              echo "version=${TAG}-${SHA8}"
              echo "docker_tag=${TAG}"
              echo "release_tag=${TAG}"
              echo "release_name=Release build (\"${TAG}\")"
              echo "npm_version=${TAG#v}"
              echo "wasm_dir=${TAG}"
            } >> "$GITHUB_OUTPUT"
          fi

  matrix_config:
    uses: ./.github/workflows/matrix_config.yml
    with:
      exclude_field: "branch"

  build:
    needs: [setup, matrix_config]

    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.matrix_config.outputs.matrix) }}

    defaults:
      run:
        shell: bash

    name: '${{ matrix.os }}-${{ matrix.cpu }}'
    runs-on: ubuntu-latest

    steps:
      - name: Install packages
        if: matrix.os == 'linux' && matrix.cpu == 'arm64'
        env:
          DEBIAN_FRONTEND: "noninteractive"
          TZ: "Etc/UTC"
        run: |
          sudo apt-get -qq update
          sudo apt-get -qq -y install binfmt-support qemu-user-static

      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref }}

      - name: Build project
        id: make_dist
        run: |
          make dist-${{ matrix.os }}-${{ matrix.cpu }}

          cd dist
          ARCHIVE=$(echo *.tar.gz)
          ARCHIVE_DIR=$(basename -s .tar.gz -- *.tar.gz)
          tar -xzf "${ARCHIVE}"

          # Expose original archive/dir names if you still want them later
          echo "archive=${ARCHIVE}" >> $GITHUB_OUTPUT
          echo "archive_dir=${ARCHIVE_DIR}" >> $GITHUB_OUTPUT

          # Compose per-component tarball names
          OS="${{ matrix.os }}"
          CPU="${{ matrix.cpu }}"
          VER="${{ needs.setup.outputs.version }}"

          NEC_TAR="nimbus-${OS}-${CPU}-${VER}.tar.gz"
          NVP_TAR="nimbus_verified_proxy-${OS}-${CPU}-${VER}.tar.gz"
          LVP_TAR="libverifproxy-${OS}-${CPU}-${VER}.tar.gz"

          # Pack each component from an explicit member list, not from exclude
          # patterns: "--exclude=build/nimbus*" also matches
          # "build/nimbus_verified_proxy", which shipped a proxy tarball with no
          # proxy in it. Listing members makes tar fail if a binary is missing.
          COMMON=(README.md)
          LVP_MEMBERS=(build/libverifproxy build/libverifproxy.a.sha512sum)
          if [[ "${OS}" == "windows" ]]; then
            COMMON+=(README-Windows.md)
            NEC_MEMBERS=(build/nimbus.exe build/nimbus.sha512sum build/librocksdb.dll)
            NVP_MEMBERS=(build/nimbus_verified_proxy.exe build/nimbus_verified_proxy.sha512sum)
          else
            NEC_MEMBERS=(build/nimbus build/nimbus.sha512sum)
            NVP_MEMBERS=(build/nimbus_verified_proxy build/nimbus_verified_proxy.sha512sum)
          fi

          tar -czf "${NEC_TAR}" -C "${ARCHIVE_DIR}" "${COMMON[@]}" "${NEC_MEMBERS[@]}"
          tar -czf "${NVP_TAR}" -C "${ARCHIVE_DIR}" "${COMMON[@]}" "${NVP_MEMBERS[@]}"
          tar -czf "${LVP_TAR}" -C "${ARCHIVE_DIR}" "${COMMON[@]}" "${LVP_MEMBERS[@]}"

          # Generate sha512 for the tarballs themselves
          sha512sum "${NEC_TAR}" > "${NEC_TAR}.sha512sum"
          sha512sum "${NVP_TAR}" > "${NVP_TAR}.sha512sum"
          sha512sum "${LVP_TAR}" > "${LVP_TAR}.sha512sum"

          echo "nec_tar=${NEC_TAR}" >> $GITHUB_OUTPUT
          echo "nvp_tar=${NVP_TAR}" >> $GITHUB_OUTPUT
          echo "lvp_tar=${LVP_TAR}" >> $GITHUB_OUTPUT

      - name: Upload execution client tarball artefact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.os }}-${{ matrix.cpu }}-execution
          path: ./dist/${{ steps.make_dist.outputs.nec_tar }}
          retention-days: 2

      - name: Upload execution client checksum artefact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.os }}-${{ matrix.cpu }}-execution-checksum
          path: ./dist/${{ steps.make_dist.outputs.nec_tar }}.sha512sum
          retention-days: 2

      - name: Upload verified proxy tarball artefact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.os }}-${{ matrix.cpu }}-proxy
          path: ./dist/${{ steps.make_dist.outputs.nvp_tar }}
          retention-days: 2

      - name: Upload verified proxy checksum artefact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.os }}-${{ matrix.cpu }}-proxy-checksum
          path: ./dist/${{ steps.make_dist.outputs.nvp_tar }}.sha512sum
          retention-days: 2

      - name: Upload libverifproxy tarball artefact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.os }}-${{ matrix.cpu }}-libverifproxy
          path: ./dist/${{ steps.make_dist.outputs.lvp_tar }}
          retention-days: 2

      - name: Upload libverifproxy checksum artefact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.os }}-${{ matrix.cpu }}-libverifproxy-checksum
          path: ./dist/${{ steps.make_dist.outputs.lvp_tar }}.sha512sum
          retention-days: 2

      - name: Build a Docker image for end users
        if: matrix.os == 'linux'
        id: docker_build
        run: |
          cd dist
          tar -xzf ${{ steps.make_dist.outputs.archive }}
          mv ${{ steps.make_dist.outputs.archive_dir }} ../docker/dist/binaries/nimbus-eth1
          cd ../docker/dist/binaries

          IMG=statusim/nimbus-eth1:${{ matrix.os }}-${{ matrix.cpu }}-${{ needs.setup.outputs.docker_tag }}
          DOCKER_BUILDKIT=1 docker build -f Dockerfile.${{ matrix.os }}-${{ matrix.cpu }} -t ${IMG} .
          echo "image=${IMG}" >> $GITHUB_OUTPUT

      # Parked, not pushed - docker_release.yml publishes it.
      - name: Save Docker image
        if: matrix.os == 'linux'
        run: docker save ${{ steps.docker_build.outputs.image }} | gzip > docker-image.tar.gz

      - name: Upload Docker image artefact
        if: matrix.os == 'linux'
        uses: actions/upload-artifact@v7
        with:
          name: docker-image-${{ matrix.os }}-${{ matrix.cpu }}
          path: docker-image.tar.gz
          # A release must outlive the review of its draft; a nightly only has
          # to reach the docker-release job in this same run.
          retention-days: ${{ needs.setup.outputs.is_nightly == 'true' && 1 || 30 }}

  build-wasm:
    name: 'wasm'
    runs-on: ubuntu-22.04

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref }}

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git llvm

      - name: Install emsdk
        run: |
          git clone https://github.com/emscripten-core/emsdk.git
          emsdk/emsdk install 3.1.73
          emsdk/emsdk activate 3.1.73

      - name: Build Nim and dependencies
        run: make -j$(nproc) init

      - name: Build WASM
        run: |
          source emsdk/emsdk_env.sh
          make -j$(nproc) nimbus_verified_proxy_wasm

      - name: Generate sha512sums for WASM files
        run: |
          cd build/nimbus_verified_proxy_wasm
          sha512sum verifproxy_wasm.js verifproxy_wasm.wasm verifproxy.js > wasm.sha512sum

      - uses: actions/upload-artifact@v7
        with:
          name: wasm
          path: build/nimbus_verified_proxy_wasm/
          retention-days: 2

  run-binary:
    needs: [setup, matrix_config, build]

    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.matrix_config.outputs.matrix) }}

    defaults:
      run:
        shell: bash

    name: 'run-binary-${{ matrix.os }}-${{ matrix.cpu }}'
    runs-on: ${{ matrix.builder }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - id: shared-action
        uses: ./.github/actions/shared
        with:
          llvm-mingw: true
          nim-cache: false
          rocksdb-cache: false
          eest-cache: false

      - name: Download execution client artefact
        uses: actions/download-artifact@v8
        with:
          name: ${{ matrix.os }}-${{ matrix.cpu }}-execution

      - name: Download verified proxy artefact
        uses: actions/download-artifact@v8
        with:
          name: ${{ matrix.os }}-${{ matrix.cpu }}-proxy

      - name: Run binary
        run: |
          VER="${{ needs.setup.outputs.version }}"
          tar -xzf nimbus-${{ matrix.os }}-${{ matrix.cpu }}-${VER}.tar.gz
          tar -xzf nimbus_verified_proxy-${{ matrix.os }}-${{ matrix.cpu }}-${VER}.tar.gz
          build/nimbus --help
          build/nimbus_verified_proxy --help

      - name: Test libverifproxy
        run: |
          make libverifproxy_test
          build/libverifproxy_test

  docker-release:
    name: Publish nightly Docker images
    # A tagged release reaches this same workflow when its draft is published.
    if: needs.setup.outputs.is_nightly == 'true'
    needs: [setup, build]
    uses: ./.github/workflows/docker_release.yml
    with:
      tag: ${{ needs.setup.outputs.docker_tag }}
    secrets: inherit

  deploy-wasm:
    name: Deploy WASM
    needs: [setup, build-wasm]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout wasm-deploy branch
        uses: actions/checkout@v6
        with:
          ref: wasm-deploy
          path: wasm-deploy/
        continue-on-error: true

      - name: Download WASM artifact
        uses: actions/download-artifact@v8
        with:
          name: wasm
          path: wasm-deploy/${{ needs.setup.outputs.wasm_dir }}/

      - name: Force-push to wasm-deploy
        run: |
          cd wasm-deploy
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "chore: update ${{ needs.setup.outputs.wasm_dir }}"
          git push origin HEAD:wasm-deploy --force

  prepare-release:
    name: Prepare release draft
    needs: [setup, build]
    runs-on: ubuntu-latest
    steps:
      - name: Download artefacts
        uses: actions/download-artifact@v8

      - name: Create release notes
        run: |
          cat > release_notes.md <<EOF
          ## Notes

          ## SHA512 checksums

          ### Nimbus

          \`\`\`text
          EOF
          echo '# Linux AMD64' >> release_notes.md
          cat linux-amd64-execution-checksum/* >> release_notes.md
          echo '# Linux ARM64' >> release_notes.md
          cat linux-arm64-execution-checksum/* >> release_notes.md
          echo '# Windows AMD64' >> release_notes.md
          cat windows-amd64-execution-checksum/* >> release_notes.md
          echo '# macOS ARM64' >> release_notes.md
          cat macos-arm64-execution-checksum/* >> release_notes.md
          echo '```' >> release_notes.md
          echo '' >> release_notes.md
          echo '### Nimbus Verified Proxy' >> release_notes.md
          echo '' >> release_notes.md
          echo '```' >> release_notes.md
          echo '# Linux AMD64' >> release_notes.md
          cat linux-amd64-proxy-checksum/* >> release_notes.md
          echo '# Linux ARM64' >> release_notes.md
          cat linux-arm64-proxy-checksum/* >> release_notes.md
          echo '# Windows AMD64' >> release_notes.md
          cat windows-amd64-proxy-checksum/* >> release_notes.md
          echo '# macOS ARM64' >> release_notes.md
          cat macos-arm64-proxy-checksum/* >> release_notes.md
          echo '```' >> release_notes.md
          echo '' >> release_notes.md
          echo '### libverifproxy' >> release_notes.md
          echo '' >> release_notes.md
          echo '```' >> release_notes.md
          echo '# Linux AMD64' >> release_notes.md
          cat linux-amd64-libverifproxy-checksum/* >> release_notes.md
          echo '# Linux ARM64' >> release_notes.md
          cat linux-arm64-libverifproxy-checksum/* >> release_notes.md
          echo '# Windows AMD64' >> release_notes.md
          cat windows-amd64-libverifproxy-checksum/* >> release_notes.md
          echo '# macOS ARM64' >> release_notes.md
          cat macos-arm64-libverifproxy-checksum/* >> release_notes.md
          echo '```' >> release_notes.md
          echo '' >> release_notes.md

      - name: Create release
        id: create_release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          draft: true
          prerelease: false
          tag_name: ${{ needs.setup.outputs.release_tag }}
          name: ${{ needs.setup.outputs.release_name }}
          body_path: release_notes.md
          files: |
            linux-amd64-execution/*
            linux-amd64-proxy/*
            linux-amd64-libverifproxy/*
            linux-arm64-execution/*
            linux-arm64-proxy/*
            linux-arm64-libverifproxy/*
            windows-amd64-execution/*
            windows-amd64-proxy/*
            windows-amd64-libverifproxy/*
            macos-arm64-execution/*
            macos-arm64-proxy/*
            macos-arm64-libverifproxy/*

  publish-npm:
    name: Publish WASM to GitHub Packages
    needs: [setup, build-wasm]
    runs-on: ubuntu-22.04

    permissions:
      packages: write

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Download WASM artefact
        uses: actions/download-artifact@v8
        with:
          name: wasm
          path: nimbus_verified_proxy/library/bindings/wasm/

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@status-im'

      - name: Set version
        run: |
          cd nimbus_verified_proxy/library/bindings/wasm
          npm version "${{ needs.setup.outputs.npm_version }}" --no-git-tag-version

      - name: Delete existing nightly package version
        if: needs.setup.outputs.is_nightly == 'true'
        run: |
          VERSION_ID=$(gh api /orgs/status-im/packages/npm/nimbus-verified-proxy/versions \
            --jq '.[] | select(.name == "0.0.0-nightly") | .id' 2>/dev/null || true)
          if [ -n "$VERSION_ID" ]; then
            gh api --method DELETE /orgs/status-im/packages/npm/nimbus-verified-proxy/versions/$VERSION_ID
            echo "Deleted version ID $VERSION_ID"
          else
            echo "No existing nightly version found, skipping"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish
        run: npm publish ${{ needs.setup.outputs.is_nightly == 'true' && '--tag nightly' || '' }}
        working-directory: nimbus_verified_proxy/library/bindings/wasm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  cleanup:
    name: Remove artefacts
    needs: [prepare-release, run-binary, deploy-wasm, publish-npm]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Delete artefacts
        uses: geekyeggo/delete-artifact@v6
        with:
          failOnError: false
          name: |
            *-execution
            *-execution-checksum
            *-proxy
            *-proxy-checksum
            *-libverifproxy
            *-libverifproxy-checksum
            wasm
