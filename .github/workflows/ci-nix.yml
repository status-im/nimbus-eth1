name: Nimbus Nix CI
permissions:
  contents: read
  pull-requests: read
  checks: write
on:
  pull_request:
    branches: [master]

jobs:
  build:
    name: '${{ matrix.system }} / ${{ matrix.nixpkg }}'
    timeout-minutes: 30
    runs-on: ${{ matrix.runs_on }}
    strategy:
      fail-fast: false
      matrix:
        system:
          - aarch64-darwin
          - x86_64-linux
        nixpkg:
          - execution_client
          - verified_proxy

        include:
          - system: aarch64-darwin
            runs_on: [self-hosted, macOS, ARM64]

          - system: x86_64-linux
            runs_on: [self-hosted, Linux, X64]

    steps:
      - uses: actions/checkout@v5
        with:
          show-progress: false
          fetch-depth: 0
          submodules: recursive
          lfs: false

      - uses: logos-co/setup-nix-cache-action@bc3136708c99ea52e2ad4573afdd05731ec779ef
        with:
          attic-endpoint:     'https://cache.nix.free.technology'
          attic-token-ci:     '${{ secrets.ATTIC_TOKEN_CI }}'
          attic-token-public: '${{ secrets.ATTIC_TOKEN_PUBLIC }}'
          install-nix: false

      - name: 'Run Nix build for ${{ matrix.nixpkg }}'
        shell: bash
        run: nix build --fallback -L '.?submodules=1#nimbus_${{ matrix.nixpkg }}'

      - name: 'Run NixOS service check for ${{ matrix.nixpkg }}'
        #if: ${{ matrix.system == 'aarch64-darwin' }}
        run: |
          nix run '.#checks.${{ matrix.system }}.${{ matrix.nixpkg }}.driver' \
            --show-trace -L --print-build-logs

      - name: 'Show result contents'
        shell: bash
        run: find result/ -type f
