name: Check vendor submodules
on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

jobs:
  check:
    name: "Check vendor submodules"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: true

      - name: Check eth1 submodules are not older than nimbus-eth2
        run: |
          bash scripts/check_vendor_eth2.sh || echo Run scripts/check_vendor_eth2.sh --update to update submodules
