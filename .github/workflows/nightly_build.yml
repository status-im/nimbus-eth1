# The nightly deliberately owns no build logic of its own: it runs the release
# pipeline in nightly mode so that a break in release.yml surfaces here instead
# of at tag-push time. See release.yml for what the two modes differ in.

name: Nightly build

on:
  schedule:
    - cron: "45 5 * * *"
  workflow_dispatch:

jobs:
  release-ci:
    name: Release CI
    uses: ./.github/workflows/release.yml
    with:
      nightly: true
    secrets: inherit
